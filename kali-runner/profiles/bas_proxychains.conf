# BAS (Breach & Attack Simulation) tunnel config -- proxychains4 wraps every
# BAS-tagged tool invocation with this, routing its TCP connections through
# the BasAgent's SOCKS5 listener (bas_agent_stub today; a real Rust agent
# installed on a customer host in a later phase) instead of this container's
# own network interface.
#
# Phase 1 note: only one tunnel endpoint exists (bas_agent_stub, a single
# docker-compose service), so this config is static. A future phase with
# multiple real per-customer agents will need per-job config generation
# (e.g. a temp file per BasJob pointing at that job's specific BasAgent).

# dynamic_chain (not strict_chain): proxychains-ng only allows a hostname
# (rather than a literal IP) for a proxy that is first/only in the list when
# the chain type isn't "strict" -- confirmed live: strict_chain rejected
# "bas_agent_stub" with "non-numeric ips are only allowed under..." even with
# proxy_dns on, since a docker-compose service name isn't a literal IP and
# container IPs aren't stable across recreates anyway.
dynamic_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 bas_agent_stub 1080
